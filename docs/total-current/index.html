<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WireView Total Current</title>
<link rel="stylesheet" href="../common/style.css">
</head>
<body>
  <div class="caption"><span>WireView Pro II · total current</span><span class="right" id="cap-right"></span></div>
  <div class="hero-wrap">
    <div class="hero">
      <div class="value"><span id="val">--</span><span class="unit">A</span></div>
      <div class="sub" id="sub">-- V avg · -- W</div>
      <div class="sub" id="temps">in -- · out -- °C</div>
      <div class="status" id="status"><span class="dot"></span><span id="status-text">Within limits</span></div>
    </div>
    <div class="gauge" id="gauge">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="42" fill="none" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="75 100" transform="rotate(135 50 50)"/>
        <circle class="fill" id="arc" cx="50" cy="50" r="42" fill="none" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="75 100" stroke-dashoffset="75" transform="rotate(135 50 50)"/>
        <text id="pct" x="50" y="56" text-anchor="middle" font-size="18" font-weight="600" fill="currentColor">--%</text>
      </svg>
    </div>
  </div>
  <div class="problem"><div class="title" id="p-title"></div><div class="hint" id="p-hint"></div></div>
<script src="../common/wireview.js"></script>
<script>
(function () {
  const WV = window.WireView, cfg = WV.cfg, body = document.body;
  document.getElementById('cap-right').textContent = 'limit ' + cfg.totalLimit + ' A';
  const val = document.getElementById('val'), sub = document.getElementById('sub'), temps = document.getElementById('temps');
  const status = document.getElementById('status'), statusText = document.getElementById('status-text');
  const gauge = document.getElementById('gauge'), arc = document.getElementById('arc'), pctEl = document.getElementById('pct');
  WV.start(function (d, err) {
    const p = WV.problemText(d, err);
    if (p) {
      document.getElementById('p-title').textContent = p.title;
      document.getElementById('p-hint').textContent = p.hint;
      body.classList.add('problem-on');
      return;
    }
    body.classList.remove('problem-on');
    const I = d.total_current;
    val.textContent = WV.fmt(I);
    sub.textContent = WV.fmt(d.avg_voltage, 2) + ' V avg · ' + WV.fmt(d.total_power, 0) + ' W';
    temps.textContent = WV.temps(d);
    const ratio = I == null ? 0 : Math.max(0, Math.min(1, I / cfg.totalLimit));
    arc.setAttribute('stroke-dashoffset', String(75 - 75 * ratio));
    pctEl.textContent = Math.round(ratio * 100) + '%';
    let lv = WV.level(I, cfg.totalLimit);
    const faults = WV.activeFaults(d);
    if (faults.length) { lv = 'crit'; statusText.textContent = faults.join(', '); }
    else statusText.textContent = lv === 'crit' ? 'Over limit' : lv === 'warn' ? 'Near limit' : 'Within limits';
    status.className = 'status ' + (lv === 'ok' ? '' : lv);
    gauge.className = 'gauge ' + (lv === 'ok' ? '' : lv);
  });
})();
</script>
</body>
</html>
