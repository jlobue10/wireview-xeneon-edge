<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WireView Xeneon Edge</title>
<style>
  /* The whole Xeneon Edge (2560x720, or 720x2560 turned upright) without iCUE:
     the widgets in iCUE-like slots. Open full-screen on the Edge, e.g.
     chromium --app=http://localhost:8765/edge/ --start-fullscreen */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { box-sizing: border-box; padding: 12px; display: flex; gap: 8px; }
  .col { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  iframe { flex: 1 1 0; min-height: 0; width: 100%; border: 0; border-radius: 12px; background: #000; }
  @media (max-aspect-ratio: 1 / 1) { body { flex-direction: column; } }
  .cursor-off, .cursor-off iframe { cursor: none; }
</style>
</head>
<body>
<script>
/* ?layout=per-wire,total-current,total-power   slots left to right (the default)
 *   a/b      stacks two widgets in one slot:  layout=per-wire,total-current/total-power
 *   name:2   makes a slot twice as wide:      layout=per-wire:2,total-power
 * Every other option (theme, wire_limit, total_limit, ...) is passed on to the widgets. */
(function () {
  const WIDGETS = ['per-wire', 'total-current', 'total-power'];
  const TITLES = { 'per-wire': 'Per-wire current', 'total-current': 'Total current', 'total-power': 'Total power' };
  const q = new URLSearchParams(location.search);
  const layout = q.get('layout') || WIDGETS.join(',');
  q.delete('layout');
  const bg = q.get('bg');
  if (bg && /^[0-9a-fA-F]{3,8}$/.test(bg)) document.documentElement.style.background = document.body.style.background = '#' + bg;
  const pass = q.toString() ? '?' + q.toString() : '';

  let slots = 0;
  layout.split(',').slice(0, 12).forEach(function (spec) {
    const m = /^([a-z\/-]+?)(?::([1-9]))?$/.exec(spec.trim().toLowerCase());
    if (!m) return;
    const names = m[1].split('/').filter(function (n) { return WIDGETS.includes(n); }).slice(0, 4);
    if (!names.length) return;
    const col = document.createElement('div');
    col.className = 'col';
    col.style.flexGrow = m[2] || '1';
    names.forEach(function (n) {
      const f = document.createElement('iframe');
      f.src = '../' + n + '/' + pass;
      f.title = TITLES[n];
      col.appendChild(f);
    });
    document.body.appendChild(col);
    slots++;
  });
  if (!slots) {
    document.body.style.cssText = 'color:#b9b8b0;font:16px system-ui,sans-serif;align-items:center;justify-content:center';
    document.body.textContent = 'No widget in ?layout= (use ' + WIDGETS.join(', ') + ')';
  }

  // A kiosk needs no pointer: hide it after a few idle seconds.
  let idle = null;
  function wake() {
    document.body.classList.remove('cursor-off');
    clearTimeout(idle);
    idle = setTimeout(function () { document.body.classList.add('cursor-off'); }, 3000);
  }
  document.addEventListener('mousemove', wake);
  wake();
})();
</script>
</body>
</html>
