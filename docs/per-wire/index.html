<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WireView Per-Wire Current</title>
<link rel="stylesheet" href="../common/style.css">
<style>
  .wires { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: calc(var(--u) * 3); min-height: 0; }
  .wire { display: flex; flex-direction: column; align-items: center; min-height: 0; gap: calc(var(--u) * 1.5); }
  .wire .amps { font-size: calc(var(--u) * 9); font-weight: 600; line-height: 1; white-space: nowrap; }
  .wire .amps .unit { font-size: 0.5em; font-weight: 400; color: var(--ink-2); margin-left: 0.1em; }
  .wire .bar { flex: 1; width: 100%; max-width: calc(var(--u) * 16); min-height: calc(var(--u) * 10);
    background: var(--track); border-radius: var(--radius); position: relative; overflow: hidden; }
  .wire .bar .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: var(--accent);
    border-radius: var(--radius) var(--radius) 0 0; transition: height 0.4s ease; }
  .wire.warn .bar .fill { background: var(--warn); }
  .wire.crit .bar .fill { background: var(--crit); }
  .wire .bar .limit { position: absolute; left: 0; right: 0; bottom: 80%; border-top: 1px dashed var(--ink-3); }
  .wire .pin { font-size: var(--fs-sub); color: var(--ink-2); letter-spacing: 0.05em; }
  .wire .watts { font-size: var(--fs-cap); color: var(--ink-3); }
  .foot { display: flex; justify-content: space-between; align-items: baseline; gap: 1em; font-size: var(--fs-sub); color: var(--ink-2); white-space: nowrap; }
  .foot b { color: var(--ink); font-weight: 600; }
  /* Vertical slots: two rows of three */
  @media (max-aspect-ratio: 1.2 / 1) {
    .wires { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; }
    .wire .amps { font-size: calc(var(--u) * 7); }
  }
</style>
</head>
<body>
  <div class="caption"><span>WireView Pro II · per-wire current</span><span class="right" id="cap-right"></span></div>
  <div class="wires" id="wires"></div>
  <div class="foot"><span>Total <b id="tot-a">--</b> A · <b id="tot-w">--</b> W</span><span class="status" id="status"><span class="dot"></span><span id="status-text">Within limits</span></span></div>
  <div class="problem"><div class="title" id="p-title"></div><div class="hint" id="p-hint"></div></div>
<script src="../common/wireview.js"></script>
<script>
(function () {
  const WV = window.WireView, cfg = WV.cfg;
  const wires = document.getElementById('wires');
  const cells = [];
  for (let n = 1; n <= 6; n++) {
    const el = document.createElement('div');
    el.className = 'wire';
    el.innerHTML = '<div class="amps"><span class="v">--</span><span class="unit">A</span></div>' +
      '<div class="bar"><div class="limit"></div><div class="fill"></div></div>' +
      '<div class="pin">Pin ' + n + '</div><div class="watts">-- W</div>';
    wires.appendChild(el);
    cells.push({ el, v: el.querySelector('.v'), fill: el.querySelector('.fill'), w: el.querySelector('.watts') });
  }
  document.getElementById('cap-right').textContent = 'limit ' + cfg.wireLimit + ' A/wire';
  const status = document.getElementById('status'), statusText = document.getElementById('status-text');
  const body = document.body;

  WV.start(function (d, err) {
    const p = WV.problemText(d, err);
    if (p) {
      document.getElementById('p-title').textContent = p.title;
      document.getElementById('p-hint').textContent = p.hint;
      body.classList.add('problem-on');
      return;
    }
    body.classList.remove('problem-on');
    let worst = 'ok';
    d.pins.forEach(function (pin, i) {
      const c = cells[i], I = pin.current;
      c.v.textContent = WV.fmt(I);
      c.w.textContent = WV.fmt(pin.power, 0) + ' W';
      const lv = WV.level(I, cfg.wireLimit);
      c.el.classList.toggle('warn', lv === 'warn');
      c.el.classList.toggle('crit', lv === 'crit');
      const pct = I == null ? 0 : Math.max(0, Math.min(100, (I / cfg.wireLimit) * 80));
      c.fill.style.height = pct + '%';
      if (lv === 'crit' || (lv === 'warn' && worst === 'ok')) worst = lv;
    });
    document.getElementById('tot-a').textContent = WV.fmt(d.total_current);
    document.getElementById('tot-w').textContent = WV.fmt(d.total_power, 0);
    const faults = WV.activeFaults(d);
    if (faults.length) { worst = 'crit'; statusText.textContent = faults.join(', '); }
    else if (worst === 'crit') statusText.textContent = 'Wire over limit';
    else if (worst === 'warn') statusText.textContent = 'Wire near limit';
    else statusText.textContent = 'Within limits';
    status.className = 'status ' + (worst === 'ok' ? '' : worst);
  });
})();
</script>
</body>
</html>
