# Builds wireview-bridge.exe for a version tag and opens a DRAFT release with
# the executable, install.ps1, SHA256SUMS and a build provenance attestation.
# Review the draft, then publish it; the installer only sees published releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # create the draft release
  id-token: write        # sign the attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Tag matches the crate version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
              Where-Object name -eq 'wireview-bridge' | Select-Object -ExpandProperty version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match version $version" }
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p wireview-bridge
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/wireview-bridge.exe, install.ps1 dist/
          $hash = (Get-FileHash dist/wireview-bridge.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS", "$hash  wireview-bridge.exe`n")
          $tick = [char]96
          $raw = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_REF_NAME/install.ps1"
          $notes = @(
              "wireview-bridge.exe SHA-256: $tick$hash$tick"
              ''
              'Install exactly this build:'
              ''
              "    powershell -ExecutionPolicy Bypass -c `"& ([scriptblock]::Create((irm $raw))) -Ref $env:GITHUB_REF_NAME -Sha256 $hash`""
              ''
              "Provenance: $($tick)gh attestation verify wireview-bridge.exe --repo $env:GITHUB_REPOSITORY$tick"
              ''
          ) -join "`n"
          [IO.File]::WriteAllText("$PWD/notes.md", $notes)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/wireview-bridge.exe
      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft --title $env:GITHUB_REF_NAME --notes-file notes.md --generate-notes dist/wireview-bridge.exe dist/install.ps1 dist/SHA256SUMS
