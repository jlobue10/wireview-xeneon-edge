# Builds wireview-bridge.exe and the static Linux binary for a version tag and
# opens a DRAFT release with both, install.ps1, install.sh, SHA256SUMS and a
# build provenance attestation.
# Review the draft, then publish it; the installer only sees published releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # create the draft release
  id-token: write        # sign the attestation
  attestations: write

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl && rustup default stable
      - run: cargo test --workspace --locked
      # musl: one static file that runs on any distribution, like the .exe.
      - run: cargo build --release --locked -p wireview-bridge --target x86_64-unknown-linux-musl
      - name: Binary smoke
        run: |
          cp target/x86_64-unknown-linux-musl/release/wireview-bridge wireview-bridge-linux-x86_64
          out=$(./wireview-bridge-linux-x86_64 --version)
          [ "$out" = "wireview-bridge ${GITHUB_REF_NAME#v}" ] || { echo "version output does not match tag: $out"; exit 1; }
          file wireview-bridge-linux-x86_64 | grep -q static || { echo "binary is not static"; exit 1; }
      - name: Installer regressions
        run: sh tests/installer.test.sh "$PWD/wireview-bridge-linux-x86_64"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: wireview-bridge-linux-x86_64
          if-no-files-found: error

  build:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: linux
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Tag matches the crate version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages |
              Where-Object name -eq 'wireview-bridge' | Select-Object -ExpandProperty version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match version $version" }
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p wireview-bridge
      - name: Binary smoke
        shell: pwsh
        run: |
          # A pipeline, not a plain assignment: for a GUI-subsystem exe pwsh otherwise
          # neither waits nor captures, and $LASTEXITCODE stays null.
          $out = (./target/release/wireview-bridge.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "wireview-bridge.exe --version failed (exit $LASTEXITCODE): $out" }
          if ($out -notlike "*$($env:GITHUB_REF_NAME.TrimStart('v'))*") { throw "version output does not match tag: $out" }
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/wireview-bridge.exe, install.ps1, install.sh, linux/wireview-bridge-linux-x86_64 dist/
          $hash = (Get-FileHash dist/wireview-bridge.exe -Algorithm SHA256).Hash.ToLower()
          $linuxHash = (Get-FileHash dist/wireview-bridge-linux-x86_64 -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS", "$hash  wireview-bridge.exe`n$linuxHash  wireview-bridge-linux-x86_64`n")
          $tick = [char]96
          $raw = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_REF_NAME/install.ps1"
          $notes = @(
              "wireview-bridge.exe SHA-256: $tick$hash$tick"
              ''
              'Install exactly this build:'
              ''
              "    powershell -ExecutionPolicy Bypass -c `"& ([scriptblock]::Create((irm $raw))) -Ref $env:GITHUB_REF_NAME -Sha256 $hash`""
              ''
              "wireview-bridge-linux-x86_64 SHA-256: $tick$linuxHash$tick"
              ''
              'Install exactly this build on Linux:'
              ''
              "    curl -fsSL $($raw -replace 'install\.ps1$', 'install.sh') | sh -s -- --ref $env:GITHUB_REF_NAME --sha256 $linuxHash"
              ''
              "Provenance: $($tick)gh attestation verify <file> --repo $env:GITHUB_REPOSITORY$tick"
              ''
          ) -join "`n"
          [IO.File]::WriteAllText("$PWD/notes.md", $notes)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/wireview-bridge.exe
            dist/wireview-bridge-linux-x86_64
      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft --title $env:GITHUB_REF_NAME --notes-file notes.md --generate-notes dist/wireview-bridge.exe dist/wireview-bridge-linux-x86_64 dist/install.ps1 dist/install.sh dist/SHA256SUMS
